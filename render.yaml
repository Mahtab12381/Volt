services:
  - type: web
    name: electricity-bill-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:server
    startCommand: node server/dist/server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 4000
